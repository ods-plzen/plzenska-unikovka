name: Aktualizace uzavírek + PMDP

on:
  schedule:
    - cron: "0 5 * * *" # každý den v 5:00 UTC (7:00 / 6:00 Plzeň)
  workflow_dispatch: {}

permissions:
  contents: write

# Dva souběžné běhy (cron + watchdog dispatch) závodí o git push — řadit za sebe.
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stáhni uzavírky z JSDI/SITmP (agp.plzen.eu)
        run: python scripts/jsdi.py

      - name: Stáhni PMDP změny v dopravě
        # PMDP scraper potřebuje aktuální closures.json kvůli matchování,
        # proto běží AŽ po jsdi.py.
        # continue-on-error: PMDP občas blokuje cloud IPs, ať to neshazuje cron.
        run: python scripts/pmdp.py
        continue-on-error: true

      - name: Diff report — co přibylo, zmizelo, změnilo se
        # Porovná HEAD (včera) s pracovním stromem (dnes), zapíše
        # src/data/changes.json a pošle NTFY souhrn štábu.
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/diffreport.py

      - name: Commitni změny dat
        # POZOR: autor commitu MUSÍ být člen Vercel týmu (tady@uhumdrum.com),
        # jinak Vercel deployment zablokuje se stavem BLOCKED / TEAM_ACCESS_REQUIRED
        # ("Git author ... must have access to the team") a `vercel deploy` visí
        # až do 12min timeoutu. Bot e-mail = blok. Neměnit na noreply bota.
        run: |
          git config user.name "Tadeáš Kapic"
          git config user.email "tady@uhumdrum.com"
          git add src/data/closures.json src/data/pmdp.json src/data/meta.json src/data/changes.json
          if git diff --cached --quiet; then
            echo "Bez změn."
          else
            git commit -m "data: aktualizace uzavírek a PMDP $(date -u +%F)"
            git push
          fi

      - name: Zrcadlo na veřejný repozitář (ods-plzen/plzenska-unikovka)
        # Veřejné repo musí být identické s produkcí — video na něj posílá
        # vývojáře. Bez MIRROR_TOKEN (PAT účtu ods-plzen s právem push) se
        # krok tiše přeskočí, cron tím nikdy nespadne.
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          if [ -z "$MIRROR_TOKEN" ]; then
            echo "MIRROR_TOKEN chybí — zrcadlení přeskočeno."; exit 0
          fi
          # actions/checkout persistuje extraheader s GITHUB_TOKENem, který by
          # přebil credentials v URL (push by šel jako github-actions[bot] → 403).
          git -c "http.https://github.com/.extraheader=" \
            push "https://x-access-token:${MIRROR_TOKEN}@github.com/ods-plzen/plzenska-unikovka.git" HEAD:main

      - name: Deploy na Vercel (produkce)
        # Deploy jde PŘÍMO přes token, GitHub integrace je odpojená (jinak by
        # Vercel gate blokoval commity od bota). ORG/PROJECT ID nejsou tajné.
        # npm global install (ne npx) kvůli spolehlivosti + timeout ať nikdy nevisí.
        timeout-minutes: 12
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_jP6cPirsUM5gWYGhVfyeyms0
          VERCEL_PROJECT_ID: prj_7agkVj2V1EqKnnFfDhUvJ8b1qFAt
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "⚠ VERCEL_TOKEN chybí — deploy přeskočen."; exit 0
          fi
          npm install --global vercel@latest
          # Prebuilt vzor: build proběhne na runneru, deploy jen nahraje hotový
          # output → jde rovnou do Ready. `vercel deploy --prod` (remote build)
          # v CI vytvoří deployment, ale build se nespustí a příkaz visí (UNKNOWN).
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          # Upload občas spadne na "Upload aborted" (flake runneru) — jeden retry.
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" || {
            echo "⚠ deploy selhal, zkouším podruhé za 30 s…"; sleep 30
            vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
          }

