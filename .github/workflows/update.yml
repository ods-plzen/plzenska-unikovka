name: Aktualizace uzavírek + PMDP

on:
  schedule:
    - cron: "0 5 * * *" # každý den v 5:00 UTC (7:00 / 6:00 Plzeň)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stáhni uzavírky z JSDI/SITmP (agp.plzen.eu)
        run: python scripts/jsdi.py

      - name: Stáhni PMDP změny v dopravě
        # PMDP scraper potřebuje aktuální closures.json kvůli matchování,
        # proto běží AŽ po jsdi.py.
        # continue-on-error: PMDP občas blokuje cloud IPs, ať to neshazuje cron.
        run: python scripts/pmdp.py
        continue-on-error: true

      - name: Commitni změny dat
        run: |
          git config user.name "plzen-prehledne-bot"
          git config user.email "bot@users.noreply.github.com"
          git add src/data/closures.json src/data/pmdp.json
          if git diff --cached --quiet; then
            echo "Bez změn."
          else
            git commit -m "data: aktualizace uzavírek a PMDP $(date -u +%F)"
            git push
          fi

      - name: Deploy na Vercel (produkce)
        # Deploy jde PŘÍMO přes token, obchází GitHub integraci — ta blokuje
        # commity od bota kvůli git-author gate (bot není člen týmu).
        # ORG/PROJECT ID nejsou tajné (jsou v .vercel/project.json), jen token je secret.
        # Aby token deploy nespadl do stejného gate, musí být GitHub integrace
        # v nastavení Vercel projektu ODPOJENÁ (Settings → Git → Disconnect).
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_jP6cPirsUM5gWYGhVfyeyms0
          VERCEL_PROJECT_ID: prj_7agkVj2V1EqKnnFfDhUvJ8b1qFAt
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "⚠ VERCEL_TOKEN chybí v GitHub secrets — deploy přeskočen."
            echo "  Přidej secret VERCEL_TOKEN a příští běh nasadí sám."
            exit 0
          fi
          npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"
