<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <title>Plzeňská únikovka — horizontální logo</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@600;700;800&amp;display=swap');
    </style>
  </defs>
  <rect width="1200" height="500" fill="#153D8A"/>
  <!-- Ikona (glyph) — bílá silnice s U-turn šipkou, vycentrovaná -->
  <g transform="translate(80,80)">
    <path d="M 60 290 L 60 130 A 60 60 0 0 1 180 130 L 180 290" stroke="#FFFFFF" stroke-width="50" fill="none" stroke-linecap="butt"/>
    <path d="M 60 330 L 10 290 L 110 290 Z" fill="#FFFFFF"/>
    <path d="M 60 290 L 60 130 A 60 60 0 0 1 180 130 L 180 290" stroke="#153D8A" stroke-width="3" fill="none" stroke-dasharray="14 10" stroke-linecap="round"/>
  </g>
  <!-- Wordmark + tagline -->
  <g font-family="Oswald, 'Arial Black', sans-serif">
    <text x="400" y="180" font-size="130" font-weight="800" letter-spacing="-2" fill="#FFFFFF">PLZEŇSKÁ</text>
    <text x="400" y="320" font-size="130" font-weight="800" letter-spacing="-2" fill="#FFFFFF">ÚNIKOVKA</text>
    <text x="402" y="390" font-size="36" font-weight="600" letter-spacing="12" fill="#009FE3">VÍTE, KUDY VEN.</text>
  </g>
</svg>
