<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <title>Plzeňská únikovka — horizontální logo</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@600;700;800&amp;display=swap');
    </style>
  </defs>
  <rect width="1200" height="500" fill="#153D8A"/>
  <!-- Ikona vycentrovaná v levém čtverci 320×500 -->
  <g transform="translate(40,130)">
    <path d="M 97 160 L 97 80 A 40 40 0 0 1 177 80 L 177 160" stroke="#FFFFFF" stroke-width="42" fill="none" stroke-linecap="butt"/>
    <path d="M 97 220 L 42 181 L 152 181 Z" fill="#FFFFFF"/>
    <path d="M 97 160 L 97 80 A 40 40 0 0 1 177 80 L 177 160" stroke="#153D8A" stroke-width="3" fill="none" stroke-dasharray="14 10" stroke-linecap="round"/>
  </g>
  <!-- Wordmark + tagline -->
  <g font-family="Oswald, 'Arial Black', sans-serif">
    <text x="320" y="200" font-size="130" font-weight="800" letter-spacing="-2" fill="#FFFFFF">PLZEŇSKÁ</text>
    <text x="320" y="340" font-size="130" font-weight="800" letter-spacing="-2" fill="#FFFFFF">ÚNIKOVKA</text>
    <text x="322" y="410" font-size="36" font-weight="600" letter-spacing="12" fill="#009FE3">VÍTE, KUDY VEN.</text>
  </g>
</svg>
