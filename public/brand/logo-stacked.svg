<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="600" height="700">
  <title>Plzeňská únikovka — vertikální logo</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@600;700;800&amp;display=swap');
    </style>
  </defs>
  <rect width="600" height="700" fill="#153D8A"/>
  <!-- Ikona vycentrovaná horizontálně -->
  <g transform="translate(180,60)">
    <path d="M 88 164 L 88 92 A 32 32 0 0 1 152 92 L 152 164" stroke="#FFFFFF" stroke-width="36" fill="none" stroke-linecap="butt"/>
    <path d="M 88 215 L 48 182 L 128 182 Z" fill="#FFFFFF"/>
    <path d="M 88 164 L 88 92 A 32 32 0 0 1 152 92 L 152 164" stroke="#153D8A" stroke-width="3" fill="none" stroke-dasharray="12 8" stroke-linecap="round"/>
  </g>
  <!-- Wordmark + tagline -->
  <g font-family="Oswald, 'Arial Black', sans-serif" text-anchor="middle">
    <text x="300" y="480" font-size="90" font-weight="800" letter-spacing="-1" fill="#FFFFFF">PLZEŇSKÁ</text>
    <text x="300" y="570" font-size="90" font-weight="800" letter-spacing="-1" fill="#FFFFFF">ÚNIKOVKA</text>
    <text x="300" y="630" font-size="28" font-weight="600" letter-spacing="10" fill="#009FE3">VÍTE, KUDY VEN.</text>
  </g>
</svg>
